# =============================================================================
#  R E P S   ·   jit-lang
# =============================================================================
[package]
name    = "jit-lang"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV).
# Raised from the collection's 1.85 baseline because the native code generator
# (cranelift-codegen 0.133) requires 1.94. This is the floor the dependency imposes.
rust-version = "1.94"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Lower IR to machine code in executable memory and run it now."

# Keywords (5 max)
keywords = ["jit", "compiler", "cranelift", "codegen", "language"]

# Categories
categories = ["development-tools", "compilers"]

# Links
homepage      = "https://github.com/jamesgober/jit-lang"
repository    = "https://github.com/jamesgober/jit-lang"
documentation = "https://docs.rs/jit-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "jit_lang"
path = "src/lib.rs"


# DEPENDENCIES
# #################################
[dependencies]
# The intermediate representation this JIT lowers. `Function` is the input to every
# compile; its frozen 1.0 surface is the only thing the translator reads.
ir-lang = "1"
# Executable, page-aligned memory with write-xor-execute protection control. Hosts the
# emitted machine code so it can be run, in place of rolling our own mmap/VirtualAlloc.
pager-lang = "1"
# The native code generator: lowers the CLIF we translate the IR into to optimized
# machine code for the host, with no C toolchain. The engine the ROADMAP mandates.
cranelift-codegen = "0.133"
# The SSA construction helper. `FunctionBuilder` is the interface we translate through,
# the same shape as ir-lang's own `Builder` that built the source IR.
cranelift-frontend = "0.133"
# Host-target detection: builds a `TargetIsa` for the running CPU with its native
# features enabled, so generated code uses the instructions the host actually has.
cranelift-native = "0.133"


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
